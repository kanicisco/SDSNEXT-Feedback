<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100">
  <defs>
    <linearGradient id="sdsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark Icon (Dynamic Hexagon / Arrow Stack) -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#sdsGrad)" />
    <!-- Modern SDS Arrow Layers -->
    <path d="M 22 26 L 44 14 L 66 26 L 44 38 Z" fill="#FFFFFF" opacity="0.95" />
    <path d="M 22 40 L 44 52 L 66 40 L 44 28 Z" fill="url(#accentGrad)" opacity="0.75" />
    <path d="M 22 54 L 44 66 L 66 54 L 44 42 Z" fill="#FFFFFF" opacity="0.95" />
    <!-- Dynamic Accent Dot -->
    <circle cx="64" cy="20" r="5" fill="#60A5FA" filter="url(#glow)" />
  </g>

  <!-- Logo Typography -->
  <g transform="translate(105, 25)">
    <!-- SDS Text -->
    <text x="0" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" letter-spacing="1">SDS</text>
    <!-- NEXT Text Badge -->
    <rect x="82" y="8" width="80" height="32" rx="8" fill="#2563EB" />
    <text x="122" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="18" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">NEXT</text>
    <!-- Tagline -->
    <text x="2" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="11" fill="#94A3B8" letter-spacing="1.5">TRAINING EVALUATION SYSTEM</text>
  </g>
</svg>
